[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Registered custom markers for modular execution
markers =
    unit: Fast in-memory algorithmic unit tests (<0.1s, no DB writes, no network)
    db: Database-backed test requiring SQLite initialization
    integration: Integration tests exercising DB, routers, endpoints, multi-service workflows
    benchmark: Heavy performance benchmarks and evaluation loops (excluded from regular runs)
    enrichment: Semantic enrichment and scientific feature discovery pipeline tests
    eda: Exploratory data analysis, distributions, correlations, group-by analytics tests
    dashboard: Adaptive decision dashboard and executive card tests
    presentation: Presentation director, memory, slide layout, visual QA tests
    copilot: Copilot reasoning, intent classification, query planner tests
    critic: Factual claim validation and evidence store tests
    ingestion: Data ingestion, file upload, sheet catalog tests
    decision_intelligence: Strategy orchestrator, investigation, reports tests

# Exclude benchmarks by default and provide fast concise output
addopts = -m "not benchmark" -ra -q --durations=5

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:woodwork.*
    ignore::UserWarning:featuretools.*
    ignore::UserWarning:pysr.*
