<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HighView | Clarity From Every Sheet</title>
    <meta name="title" content="HighView | AI-Powered Spreadsheet Insights &amp; Presentations" />
    <meta name="description" content="HighView transforms departmental spreadsheets into clear insights, executive summaries, and presentation-ready stories, powered by HRIDAY." />
    <meta name="keywords" content="HighView, spreadsheet analysis, AI insights, data insights, presentation generation, PowerPoint automation, executive reporting, business intelligence, HRIDAY AI" />
    <meta name="application-name" content="HighView" />
    <meta name="apple-mobile-web-app-title" content="HighView" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HighView" />
    <meta property="og:title" content="HighView — Clarity From Every Sheet" />
    <meta property="og:description" content="Turn spreadsheets into meaningful insights, executive summaries, and presentation-ready stories with HighView, powered by HRIDAY." />
    <meta property="og:image" content="/highview-logo-512.png" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HighView — Clarity From Every Sheet" />
    <meta name="twitter:description" content="Turn spreadsheets into meaningful insights, executive summaries, and presentation-ready stories with HighView, powered by HRIDAY." />
    <meta name="twitter:image" content="/highview-logo-512.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "HighView",
      "headline": "Clarity From Every Sheet.",
      "description": "HighView transforms departmental spreadsheets into clear insights, executive summaries, and presentation-ready stories, powered by HRIDAY.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "creator": {
        "@type": "Organization",
        "name": "HighView"
      }
    }
    </script>
    <!-- Prevent theme flash: set data-theme before render -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('highview_theme');
          var theme = (saved === 'dark') ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
